[package]
name = "litematica3d"
version = "0.1.0"
description = "Visor y biblioteca de schematics de Minecraft"
authors = ["Ángel Serrano Domínguez"]
license = "LicenseRef-Propietaria"
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litematica3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2.6.3"
flate2 = "1.1.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
trash = "5.2.9"
uuid = { version = "1.28", features = ["v4"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
rayon = "1.12"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
png = "0.18"

[dev-dependencies]
tempfile = "3.27"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
